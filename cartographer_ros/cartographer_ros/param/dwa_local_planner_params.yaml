DWAPlannerROS:

# Robot Configuration Parameters
  max_vel_x: 0.4
  min_vel_x: -0.22

  max_vel_y: 0.0
  min_vel_y: 0.0

# The velocity when robot is moving in a straight line
  max_trans_vel:  0.50
  min_trans_vel:  0.11

  max_rot_vel: 2.75
  min_rot_vel: 1.37

  acc_lim_x: 2.0
  acc_lim_y: 0.0
  acc_lim_theta: 3.2 

# Goal Tolerance Parametes 
  xy_goal_tolerance: 0.20 # 0.05
  yaw_goal_tolerance: 0.25  # 0.17
  latch_xy_goal_tolerance: true

# Forward Simulation Parameters
  sim_time: 1.0
  vx_samples: 30
  vy_samples: 0
  vth_samples: 50
  controller_frequency: 10.0

# Trajectory Scoring Parameters
  path_distance_bias: 20.0
  goal_distance_bias: 15.0
  occdist_scale: 0.2
  forward_point_distance: 0.5
  stop_time_buffer: 0.3
  scaling_speed: 0.15
  max_scaling_factor: 0.3

# Oscillation Prevention Parameters
  oscillation_reset_dist: 0.1

# Debugging
  publish_traj_pc : true
  publish_cost_grid_pc: true
